{% extends "base.html" %}

{% block titulo %}
Nuevo Cliente
{% endblock %}

{% block contenido %}

<h2 class="mb-4">
    {{ titulo }}
</h2>

<form method="post">

    {% csrf_token %}

    {{ formulario.as_p }}

    <button
            type="submit"
            class="btn btn-success">
        Guardar
    </button>

    <a href="/clientes/" class="btn btn-secondary">
        Cancelar
    </a>

</form>

{% endblock %}
